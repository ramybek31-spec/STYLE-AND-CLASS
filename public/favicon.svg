<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Subtle luxury gradient for the background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18191e"/>
      <stop offset="50%" stop-color="#121316"/>
      <stop offset="100%" stop-color="#0d0d10"/>
    </linearGradient>

    <!-- Warm antique gold metallic gradient for border and emblems -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfc07e"/>
      <stop offset="50%" stop-color="#c5a059"/>
      <stop offset="100%" stop-color="#8d6e30"/>
    </linearGradient>

    <!-- Subtle inner border gold sheen -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c5a059" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#7e6532" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c5a059" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base Frame -->
  <rect 
    x="14" 
    y="14" 
    width="484" 
    height="484" 
    rx="132" 
    ry="132" 
    fill="url(#bgGrad)" 
    stroke="url(#borderGrad)" 
    stroke-width="3"
  />

  <!-- Inner delicate hairline ring -->
  <rect 
    x="20" 
    y="20" 
    width="472" 
    height="472" 
    rx="126" 
    ry="126" 
    fill="none" 
    stroke="#c5a059" 
    stroke-width="0.75" 
    stroke-opacity="0.3"
  />

  <!-- Top Diamond Hallmark -->
  <polygon 
    points="256,72 269,90 256,108 243,90" 
    fill="url(#goldGrad)" 
  />

  <!-- Bottom Diamond Hallmark -->
  <polygon 
    points="256,404 269,422 256,440 243,422" 
    fill="url(#goldGrad)" 
  />
</svg>
